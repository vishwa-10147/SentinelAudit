<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Sentinel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; background: #f7f7fa; }
        .form-box { background: #fff; padding: 2em; max-width: 400px; margin: 5em auto; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
        h2 { color: #2c3e50; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { background: #2c3e50; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Reset Password for {{ user.username }}</h2>
        <form method="post">
            <label>New Password</label>
            <input type="password" name="password" required>
            <button type="submit">Reset</button>
        </form>
        <a href="/users">Back to Users</a>
    </div>
</body>
</html>
